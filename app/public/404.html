<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Page not found · Coil</title>
<style>
  :root { --paper:#f4f4f1; --ink:#111113; --ink-2:#4a4a52; --accent:#f7931a; }
  @media (prefers-color-scheme: dark) { :root { --paper:#0e0e10; --ink:#ededea; --ink-2:#a8a8b0; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--paper); color:var(--ink); font-family: Arial, Helvetica, sans-serif; padding:16px; }
  main { max-width:560px; } p.k { font-family: ui-monospace, Menlo, monospace; color:var(--ink-2); margin:0; }
  h1 { font-size: clamp(32px, 6vw, 56px); margin: 8px 0 16px; letter-spacing:-1px; }
  a { color: inherit; } .btn { display:inline-block; margin: 8px 12px 0 0; padding: 12px 18px; border-radius: 10px; border:1px solid var(--ink-2); text-decoration:none; }
  .btn--a { background: var(--accent); color:#111113; border-color: var(--accent); }
</style>
</head>
<body><main>
  <p class="k">404</p>
  <h1>This page doesn't exist.</h1>
  <p style="color:var(--ink-2)">The link may be old. Everything Coil does is one tap away.</p>
  <a class="btn btn--a" href="/#/app">Open the app</a><a class="btn" href="/#/proof">See the proof</a><a class="btn" href="/">Home</a>
</main></body>
</html>
